name: Imagem de release
run-name: Imagem de release ${{ inputs.versao }}

# Publica imagem, nunca conecta ou implanta na maquina do Andre.
on:
  workflow_dispatch:
    inputs:
      versao:
        description: Tag aprovada de main (vMAJOR.MINOR.PATCH)
        type: string
        required: true

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validar.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: validar
        env:
          VERSAO: ${{ inputs.versao }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$VERSAO" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sha=$(git rev-parse "refs/tags/$VERSAO^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          # Nesta primeira versao, publicar somente a tag no HEAD de main.
          # Assim a CI reutilizavel abaixo testa exatamente o commit publicado.
          [[ "$sha" == "$GITHUB_SHA" ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  testes:
    needs: validar
    uses: ./.github/workflows/ci.yml

  publicar:
    needs: [validar, testes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validar.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/joaozuneda9/centralalmoxarifado-django-docker:${{ inputs.versao }}
          build-args: REVISAO_APP=${{ needs.validar.outputs.sha }}
      - name: Registrar imagem para o deploy manual
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ needs.validar.outputs.sha }}
        run: |
          echo "Commit: $SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Imagem: ghcr.io/joaozuneda9/centralalmoxarifado-django-docker@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
