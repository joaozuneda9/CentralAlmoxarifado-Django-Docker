# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# Configuração do CodeRabbit para o Central Almoxarifado (Django).
language: "pt-BR"

reviews:
  profile: "chill"
  poem: false
  auto_review:
    # Os PRs de trabalho têm a develop como base; a main (padrão) já é revisada.
    base_branches:
      - "develop"
  path_filters:
    # Planos e specs são registro do processo; o DESIGN.md é cópia do WMS-Almoxarifado.
    - "!docs/superpowers/**"
    - "!docs/DESIGN.md"
  path_instructions:
    - path: "**/migrations/*.py"
      instructions: |
        O sistema está em produção com dados reais. Mudança de modelo ganha uma migration nova;
        migration já existente nunca é regenerada, editada nem apagada (nem `migrate <app> zero`).
        Aponte como problema qualquer alteração em migration já publicada. Em migration nova que
        mexe em tabela com dados, vale pedir conversão dos dados existentes, checagem de colisão
        e reversão segura quando fizer sentido.
    - path: "**/*.py"
      instructions: |
        Textos de interface, mensagens e nomes de código são em português (pt-BR), de propósito.
        Banco: MySQL 8 ou MariaDB (mysqlclient, utf8mb4). Os testes rodam contra MySQL/MariaDB,
        nunca SQLite.
